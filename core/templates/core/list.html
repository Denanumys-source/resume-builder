{% extends 'base.html' %}
{% block title %}Resume{% endblock %}
{% block content %}
<h1>Resume list</h1>
<div style="display:flex;justify-content: flex-end;">
<a href ='{% url "core:resume-create" %}' class="btn btn-outline-primary" style="margin-bottom: 10px;"><h4>+</h4></a>
</div class="container-fluid">
{% for resume in resume %}
    <div class="card mb-3:">
        <div class="row">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button class="btn btn-warning"><a href="{% url 'core:resume-update' resume.id %}" style="color:white;text-decoration:none;">Оновити</a></button>
            </div>
            <div class="card-body">
                <h5 class="card-title">{{ resume.title }}</h5>
                <p class="card-text">Посада: {{ resume.occupation }}</p>
                <p class="card-text">Дата створення: {{ resume.created_at }}</p>
            </div>
            <a href="{% url 'core:resume-detail' resume.id %}" class="btn btn-primary mb-3">View Details</a>
        </div>
    </div>
{% empty %}
    <p>No resumes found.</p>
{% endfor %}
{% endblock %}
