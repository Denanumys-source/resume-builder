<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'core:resume-list' %}">Home</a>
        </li>
      </ul>
      <ul class="navbar-nav">
          {% if user.is_authenticated %}
              <li class="nav-item">
                <span class="nav-link">{{ user.username }}</span>
              </li>
                    <li class="nav-item">
                        <form method="post" action="{% url 'accounts:logout' %}">
                            {% csrf_token %}
                          <button type="submit" class="nav-link btn btn-link">Вийти</button>
                        </form>
                    </li>
            {% else %}
                <li class="nav-item"><a class="nav-link" href="{% url 'accounts:login' %}">Увійти</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'accounts:register' %}">Реєстрація</a></li>
            {% endif %}
      </ul>
    </div>
  </div>
</nav>
