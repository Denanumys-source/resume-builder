{% extends 'base.html' %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
  <!-- Кнопка назад -->
  <div class="mb-3">
    <a href="{% url 'core:resume-list' %}" class="btn btn-outline-secondary btn-sm shadow-sm">
      <i class="bi bi-arrow-left"></i> back to resume list
    </a>
  </div>

  <!-- Панель перемикання шаблонів -->
  <div class="card shadow-sm border-0 mb-3 bg-light rounded-4">
    <div class="card-body p-2 d-flex align-items-center justify-content-between">
      <span class="fw-semibold text-muted small ms-2">
        <i class="bi bi-layout-text-window-reverse me-1"></i> Оберіть шаблон:
      </span>
      <div class="btn-group" role="group" aria-label="Template selection">
        <a href="{% url 'core:template-one' %}" class="btn btn-sm btn-outline-secondary px-3 rounded-pill ms-1">
          <i class="bi bi-file-earmark-text me-1"></i> Шаблон 1
        </a>
        <a href="{% url 'core:template-two' %}" class="btn btn-sm btn-outline-secondary px-3 rounded-pill ms-1">
          <i class="bi bi-file-earmark-code me-1"></i> Шаблон 2
        </a>
        <a href="{% url 'core:template-three' %}" class="btn btn-sm btn-outline-secondary px-3 rounded-pill ms-1">
          <i class="bi bi-file-earmark-code me-1"></i> Шаблон 3
        </a>
      </div>
    </div>
  </div>

  <!-- Картка форми -->
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
      <h5 class="card-title mb-0 fw-bold">Resume Form</h5>
    </div>
    
    <div class="card-body p-4">
      <form method="post">
        {% csrf_token %}

        <div class="bs-form-soft">
          {{ form.as_p }}
        </div>

        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-primary btn-lg shadow-sm rounded-3">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  /* Варіант 1: Soft Rounded Style */
  .bs-form-soft p {
    margin-bottom: 1.2rem;
  }
  .bs-form-soft label {
    font-size: 0.875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #6c757d;
    margin-bottom: 0.4rem;
    display: block;
  }
  .bs-form-soft input,
  .bs-form-soft textarea,
  .bs-form-soft select {
    display: block;
    width: 100%;
    padding: 0.6rem 0.9rem;
    font-size: 0.95rem;
    background-color: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 0.5rem;
    transition: all 0.2s ease-in-out;
  }
  .bs-form-soft input:focus,
  .bs-form-soft textarea:focus,
  .bs-form-soft select:focus {
    background-color: #fff;
    border-color: #0d6efd;
    outline: 0;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
  }
</style>
{% endblock %}
